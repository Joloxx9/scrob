name: Dev image (fork)

# Builds this fork's branches to ghcr.io/<owner>/scrob, independent of the
# upstream docker.yml (which targets Docker Hub + ghcr.io/ellite/scrob and
# needs secrets this fork doesn't have). Local, pre-PR iteration only.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize branch name
        id: branch
        run: echo "tag=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/scrob" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.branch.outputs.tag }}-dev
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.branch.outputs.tag }}
          cache-from: type=gha,scope=scrob-dev-${{ steps.branch.outputs.tag }}
          cache-to: type=gha,mode=max,scope=scrob-dev-${{ steps.branch.outputs.tag }}
